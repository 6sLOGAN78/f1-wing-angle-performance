[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-wing-angle-performance"
version = "0.1.0"
description = "Reproducible analysis of rear-wing angle effects on a representative Formula 1-style car"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:rerunfailures"

